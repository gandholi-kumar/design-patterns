openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: code-runner
    description: Code execution operations
  - name: notes
    description: Per-pattern rich notes operations
  - name: progress
    description: Learning progress and bookmark operations
  - name: media
    description: Direct object storage media operations
  - name: ai
    description: GoF AI architect consultation and decision ledger
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /code/run:
    post:
      operationId: executeCode
      tags: [code-runner]
      summary: Execute multi-file code project
      description: Compiles and executes multi-file code projects in an isolated sandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteCodeRequest"
      responses:
        "200":
          description: Code execution completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionResult"
  /patterns/{patternId}/notes:
    get:
      operationId: getPatternNote
      tags: [notes]
      summary: Get pattern note
      description: Retrieves the rich note document for the specified pattern ID
      parameters:
        - name: patternId
          in: path
          required: true
          description: The canonical GoF pattern slug (e.g. factory-method)
          schema:
            type: string
      responses:
        "200":
          description: Note found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatternNote"
        "404":
          description: Note not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: upsertPatternNote
      tags: [notes]
      summary: Upsert pattern note
      description: Creates or updates the rich note document for the specified pattern ID
      parameters:
        - name: patternId
          in: path
          required: true
          description: The canonical GoF pattern slug (e.g. factory-method)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPatternNoteRequest"
      responses:
        "200":
          description: Note saved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatternNote"
        "400":
          description: Invalid note document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePatternNote
      tags: [notes]
      summary: Delete pattern note
      description: Deletes the note document for the specified pattern ID
      parameters:
        - name: patternId
          in: path
          required: true
          description: The canonical GoF pattern slug (e.g. factory-method)
          schema:
            type: string
      responses:
        "204":
          description: Note deleted successfully
        "404":
          description: Note not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notes:
    get:
      operationId: listPatternNotes
      tags: [notes]
      summary: List all pattern notes
      description: Retrieves all pattern notes for the current user
      responses:
        "200":
          description: List of pattern notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatternNotesListResponse"
  /notes/export:
    get:
      operationId: exportAllNotes
      tags: [notes]
      summary: Export all notes bundle
      description: Exports all pattern notes as a portable JSON payload with inlined media assets
      responses:
        "200":
          description: Exported notes payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotesExportPayload"
  /notes/import:
    post:
      operationId: importNotes
      tags: [notes]
      summary: Import notes bundle
      description: Imports a previously exported notes bundle, replacing pattern notes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotesImportRequest"
      responses:
        "200":
          description: Import completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotesImportResponse"
  /progress:
    get:
      operationId: getProgress
      tags: [progress]
      summary: Get user learning progress
      description: Retrieves all learning progress recorded for the authenticated user
      responses:
        "200":
          description: Learning progress map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProgressResponse"
    put:
      operationId: upsertProgress
      tags: [progress]
      summary: Upsert pattern progress
      description: Updates or creates progress for a specific pattern
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertProgressRequest"
      responses:
        "200":
          description: Progress saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressRecord"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bookmarks:
    get:
      operationId: getBookmarks
      tags: [progress]
      summary: Get user bookmarks
      description: Returns array of pattern IDs bookmarked by authenticated user
      responses:
        "200":
          description: List of bookmarked pattern IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
    post:
      operationId: toggleBookmark
      tags: [progress]
      summary: Toggle pattern bookmark
      description: Toggles bookmark status for a specific pattern
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleBookmarkRequest"
      responses:
        "200":
          description: Bookmark toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkToggleResult"
  /media/upload:
    post:
      operationId: uploadMedia
      tags: [media]
      summary: Upload binary media asset
      description: Direct binary upload to MinIO S3 object storage
      parameters:
        - name: patternId
          in: query
          required: false
          schema:
            type: string
        - name: filename
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Asset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadResponse"
        "400":
          description: Empty or invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /media/{assetId}:
    get:
      operationId: getMediaAsset
      tags: [media]
      summary: Serve media asset
      description: Streams media asset directly from MinIO object storage
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Media asset stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Media asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMediaAsset
      tags: [media]
      summary: Delete media asset
      description: Permanently removes media asset from MinIO and PostgreSQL
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteMediaResponse"
  /ai/architect-consult:
    post:
      operationId: consultArchitect
      tags: [ai]
      summary: Consult AI architect on design pattern decision
      description: AI copilot consult using server-side Gemini Pro or deterministic fallback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultArchitectRequest"
      responses:
        "200":
          description: Architectural consultation verdict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchitectConsultResult"
  /ai/decision-ledger:
    get:
      operationId: getDecisionLedger
      tags: [ai]
      summary: Get cloud-persisted decision history
      description: Retrieves user's cloud-persisted GoF decision history
      responses:
        "200":
          description: Decision ledger entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionLedgerListResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CodeFile:
      type: object
      required:
        - name
        - content
      properties:
        name:
          type: string
          example: "Main.java"
        content:
          type: string
          example: "public class Main { public static void main(String[] args) { System.out.println(\"Hello\"); } }"
    ExecuteCodeRequest:
      type: object
      required:
        - language
        - files
      properties:
        language:
          type: string
          enum: [java, typescript, python, go, rust, csharp]
          example: "java"
        files:
          type: array
          items:
            $ref: "#/components/schemas/CodeFile"
        entryPoint:
          type: string
          example: "Main.java"
        stdin:
          type: string
          default: ""
        timeoutMs:
          type: integer
          default: 25000
    ExecutionResult:
      type: object
      required:
        - status
        - stdout
        - stderr
        - exitCode
        - durationMs
      properties:
        status:
          type: string
          enum: [success, compile_error, runtime_error, timeout]
        stdout:
          type: array
          items:
            type: string
        stderr:
          type: array
          items:
            type: string
        exitCode:
          type: integer
        durationMs:
          type: number
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "NOTE_NOT_FOUND"
        message:
          type: string
          example: "Note for pattern 'factory-method' does not exist"
    NoteBlock:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          example: "blk-1a2b3c4d"
        type:
          type: string
          example: "paragraph"
        props:
          type: object
          additionalProperties: true
        content:
          oneOf:
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: object
              additionalProperties: true
            - type: string
        children:
          type: array
          items:
            type: object
            additionalProperties: true
    PatternNote:
      type: object
      required:
        - patternId
        - blocks
        - lastModified
        - version
      properties:
        patternId:
          type: string
          example: "abstract-factory"
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/NoteBlock"
        lastModified:
          type: string
          format: date-time
          example: "2026-10-12T20:30:00.000Z"
        version:
          type: integer
          default: 1
          example: 1
    UpsertPatternNoteRequest:
      type: object
      required:
        - blocks
      properties:
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/NoteBlock"
    PatternNotesListResponse:
      type: object
      required:
        - notes
        - total
      properties:
        notes:
          type: array
          items:
            $ref: "#/components/schemas/PatternNote"
        total:
          type: integer
          example: 8
    NotesExportPayload:
      type: object
      required:
        - version
        - exportedAt
        - notes
      properties:
        version:
          type: integer
          default: 1
          example: 1
        exportedAt:
          type: string
          format: date-time
          example: "2026-10-12T20:30:00.000Z"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/PatternNote"
    NotesImportRequest:
      type: object
      required:
        - version
        - notes
      properties:
        version:
          type: integer
          default: 1
          example: 1
        notes:
          type: array
          items:
            $ref: "#/components/schemas/PatternNote"
    NotesImportResponse:
      type: object
      required:
        - importedCount
        - status
      properties:
        importedCount:
          type: integer
          example: 8
        status:
          type: string
          example: "success"
    ProgressRecord:
      type: object
      required:
        - patternId
        - attempts
        - correct
        - box
      properties:
        id:
          type: string
        userId:
          type: string
        patternId:
          type: string
        attempts:
          type: integer
          default: 0
        correct:
          type: integer
          default: 0
        box:
          type: integer
          default: 1
        note:
          type: string
          default: ""
        updatedAt:
          type: string
          format: date-time
    UserProgressItem:
      type: object
      required:
        - attempts
        - correct
        - box
      properties:
        attempts:
          type: integer
        correct:
          type: integer
        box:
          type: integer
        note:
          type: string
          default: ""
    UserProgressResponse:
      type: object
      required:
        - progress
      properties:
        progress:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/UserProgressItem"
    UpsertProgressRequest:
      type: object
      required:
        - patternId
      properties:
        patternId:
          type: string
        attempts:
          type: integer
          default: 0
        correct:
          type: integer
          default: 0
        box:
          type: integer
          default: 1
        note:
          type: string
          default: ""
    ToggleBookmarkRequest:
      type: object
      required:
        - patternId
      properties:
        patternId:
          type: string
    BookmarkToggleResult:
      type: object
      required:
        - patternId
        - bookmarked
      properties:
        patternId:
          type: string
        bookmarked:
          type: boolean
    MediaUploadResponse:
      type: object
      required:
        - id
        - url
        - s3Key
        - publicUrl
      properties:
        id:
          type: string
        url:
          type: string
        s3Key:
          type: string
        publicUrl:
          type: string
    DeleteMediaResponse:
      type: object
      required:
        - success
        - assetId
      properties:
        success:
          type: boolean
        assetId:
          type: string
    AiTurn:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
    ConsultArchitectRequest:
      type: object
      required:
        - problemStatement
      properties:
        problemStatement:
          type: string
        turns:
          type: array
          items:
            $ref: "#/components/schemas/AiTurn"
    GoFPatternVerdict:
      type: object
      required:
        - id
        - name
        - category
        - confidence
        - architecturalRationale
        - structuralApplicability
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
          enum: [Creational, Structural, Behavioral]
        confidence:
          type: number
        architecturalRationale:
          type: string
        structuralApplicability:
          type: string
    GoFRunnerUpVerdict:
      type: object
      required:
        - id
        - name
        - category
        - confidence
        - whyConsidered
        - whenToChooseRunnerUpOverPrimary
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
          enum: [Creational, Structural, Behavioral]
        confidence:
          type: number
        whyConsidered:
          type: string
        whenToChooseRunnerUpOverPrimary:
          type: string
    GoFTradeOffDilemma:
      type: object
      required:
        - primaryGains
        - primaryTaxes
        - decisiveDifferentiator
      properties:
        primaryGains:
          type: array
          items:
            type: string
        primaryTaxes:
          type: array
          items:
            type: string
        decisiveDifferentiator:
          type: string
    GoFDecisionVerdict:
      type: object
      required:
        - primaryPattern
        - runnerUpPattern
        - tradeOffDilemma
        - codeSmellWarning
      properties:
        primaryPattern:
          $ref: "#/components/schemas/GoFPatternVerdict"
        runnerUpPattern:
          $ref: "#/components/schemas/GoFRunnerUpVerdict"
        tradeOffDilemma:
          $ref: "#/components/schemas/GoFTradeOffDilemma"
        codeSmellWarning:
          type: string
    ArchitectConsultResult:
      type: object
      required:
        - verdict
        - mode
        - engine
      properties:
        verdict:
          $ref: "#/components/schemas/GoFDecisionVerdict"
        mode:
          type: string
        engine:
          type: string
    DecisionLedgerItem:
      type: object
      required:
        - id
        - userId
        - problemStatement
        - primaryPattern
      properties:
        id:
          type: string
        userId:
          type: string
        problemStatement:
          type: string
        primaryPattern:
          type: string
        runnerUpPattern:
          type: string
        confidence:
          type: number
        tradeOffs:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    DecisionLedgerListResponse:
      type: array
      items:
        $ref: "#/components/schemas/DecisionLedgerItem"

