openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: code-runner
    description: Code execution operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /code/run:
    post:
      operationId: executeCode
      tags: [code-runner]
      summary: Execute multi-file code project
      description: Compiles and executes multi-file code projects in an isolated sandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteCodeRequest"
      responses:
        "200":
          description: Code execution completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionResult"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CodeFile:
      type: object
      required:
        - name
        - content
      properties:
        name:
          type: string
          example: "Main.java"
        content:
          type: string
          example: "public class Main { public static void main(String[] args) { System.out.println(\"Hello\"); } }"
    ExecuteCodeRequest:
      type: object
      required:
        - language
        - files
      properties:
        language:
          type: string
          enum: [java, typescript, python, go, rust, csharp]
          example: "java"
        files:
          type: array
          items:
            $ref: "#/components/schemas/CodeFile"
        entryPoint:
          type: string
          example: "Main.java"
        stdin:
          type: string
          default: ""
        timeoutMs:
          type: integer
          default: 5000
    ExecutionResult:
      type: object
      required:
        - status
        - stdout
        - stderr
        - exitCode
        - durationMs
      properties:
        status:
          type: string
          enum: [success, compile_error, runtime_error, timeout]
        stdout:
          type: array
          items:
            type: string
        stderr:
          type: array
          items:
            type: string
        exitCode:
          type: integer
        durationMs:
          type: number
