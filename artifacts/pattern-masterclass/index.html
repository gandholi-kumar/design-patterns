        <section aria-labelledby="creational-heading">
          <h2 id="creational-heading">Creational Design Patterns</h2>
          <p>Mechanisms for creating objects in a manner suitable to the situation:</p>
          <ul>
            <li><a href="/pattern/factory-method">Factory Method Pattern</a> - Delegate instantiation to subclasses.</li>
            <li><a href="/pattern/abstract-factory">Abstract Factory Pattern</a> - Produce families of related objects.</li>
            <li><a href="/pattern/builder">Builder Pattern</a> - Construct complex objects step by step.</li>
            <li><a href="/pattern/prototype">Prototype Pattern</a> - Clone existing objects without depending on their concrete classes.</li>
            <li><a href="/pattern/singleton">Singleton Pattern</a> - Ensure a class has only one instance with a global access point.</li>
          </ul>
        </section>

        <section aria-labelledby="structural-heading">
          <h2 id="structural-heading">Structural Design Patterns</h2>
          <p>How classes and objects are composed to form larger structures:</p>
          <ul>
            <li><a href="/pattern/adapter">Adapter Pattern</a> - Allow incompatible interfaces to collaborate.</li>
            <li><a href="/pattern/bridge">Bridge Pattern</a> - Decouple an abstraction from its implementation.</li>
            <li><a href="/pattern/composite">Composite Pattern</a> - Compose objects into tree structures to represent part-whole hierarchies.</li>
            <li><a href="/pattern/decorator">Decorator Pattern</a> - Attach new responsibilities to objects dynamically.</li>
            <li><a href="/pattern/facade">Facade Pattern</a> - Provide a simplified interface to a complex library or subsystem.</li>
            <li><a href="/pattern/flyweight">Flyweight Pattern</a> - Fit more objects into available RAM by sharing common state.</li>
            <li><a href="/pattern/proxy">Proxy Pattern</a> - Provide a placeholder or surrogate to control access to another object.</li>
          </ul>
        </section>

        <section aria-labelledby="behavioral-heading">
          <h2 id="behavioral-heading">Behavioral Design Patterns</h2>
          <p>Algorithms and the assignment of responsibilities between objects:</p>
          <ul>
            <li><a href="/pattern/chain-of-responsibility">Chain of Responsibility Pattern</a> - Pass requests along a handler chain.</li>
            <li><a href="/pattern/command">Command Pattern</a> - Encapsulate requests as stand-alone objects.</li>
            <li><a href="/pattern/interpreter">Interpreter Pattern</a> - Define a grammar representation and interpreter for a language.</li>
            <li><a href="/pattern/iterator">Iterator Pattern</a> - Traverse elements of a collection without exposing underlying representation.</li>
            <li><a href="/pattern/mediator">Mediator Pattern</a> - Restrict direct communications between objects and force them to collaborate via a mediator.</li>
            <li><a href="/pattern/memento">Memento Pattern</a> - Save and restore previous states of an object without revealing implementation details.</li>
            <li><a href="/pattern/observer">Observer Pattern</a> - Subscription mechanism to notify multiple observers about state changes.</li>
            <li><a href="/pattern/state">State Pattern</a> - Alter object behavior when its internal state changes.</li>
            <li><a href="/pattern/strategy">Strategy Pattern</a> - Define a family of interchangeable algorithms.</li>
            <li><a href="/pattern/template-method">Template Method Pattern</a> - Skeleton of an algorithm in the superclass, letting subclasses override steps.</li>
            <li><a href="/pattern/visitor">Visitor Pattern</a> - Separate algorithms from the objects on which they operate.</li>
          </ul>
        </section>
