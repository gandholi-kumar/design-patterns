<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="20%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#090d16" stop-opacity="1" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="boxBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Subtle Blueprint Grid -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="320" y1="0" x2="320" y2="630" />
    <line x1="440" y1="0" x2="440" y2="630" />
    <line x1="560" y1="0" x2="560" y2="630" />
    <line x1="680" y1="0" x2="680" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="920" y1="0" x2="920" y2="630" />
    <line x1="1040" y1="0" x2="1040" y2="630" />
    <line x1="1160" y1="0" x2="1160" y2="630" />
    
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="380" x2="1200" y2="380" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="0" y1="580" x2="1200" y2="580" />
  </g>

  <!-- Glowing Accent Sphere -->
  <circle cx="1020" cy="220" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle cx="920" cy="420" r="180" fill="#818cf8" opacity="0.1" filter="url(#glow)" />

  <!-- Category Badges -->
  <g transform="translate(100, 110)">
    <rect x="0" y="0" width="130" height="34" rx="17" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-opacity="0.5" />
    <text x="65" y="22" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">CREATIONAL</text>

    <rect x="145" y="0" width="130" height="34" rx="17" fill="#4338ca" fill-opacity="0.25" stroke="#818cf8" stroke-opacity="0.5" />
    <text x="210" y="22" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#818cf8" text-anchor="middle" letter-spacing="1">STRUCTURAL</text>

    <rect x="290" y="0" width="130" height="34" rx="17" fill="#7e22ce" fill-opacity="0.25" stroke="#c084fc" stroke-opacity="0.5" />
    <text x="355" y="22" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#c084fc" text-anchor="middle" letter-spacing="1">BEHAVIORAL</text>
  </g>

  <!-- Headline -->
  <text x="100" y="240" font-family="Inter, -apple-system, sans-serif" font-size="58" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">
    GoF Design Patterns
  </text>
  <text x="100" y="315" font-family="Inter, -apple-system, sans-serif" font-size="58" font-weight="800" fill="url(#accentGradient)" letter-spacing="-1.5">
    Masterclass
  </text>

  <!-- Subtitle -->
  <text x="100" y="380" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Interactive catalog, Java/TypeScript playgrounds, UML diagrams,
  </text>
  <text x="100" y="415" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    trade-off decision engine &amp; scenario diagnostic quizzes.
  </text>

  <!-- Metric / Feature Badges on right -->
  <g transform="translate(760, 150)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="340" height="96" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="url(#boxBorder)" stroke-width="1.5" />
    <text x="24" y="44" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#38bdf8">23 Patterns</text>
    <text x="24" y="72" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Complete Gang of Four catalog</text>

    <!-- Card 2 -->
    <rect x="0" y="116" width="340" height="96" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="url(#boxBorder)" stroke-width="1.5" />
    <text x="24" y="160" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#818cf8">Java &amp; TS</text>
    <text x="24" y="188" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Dual-language live code execution</text>

    <!-- Card 3 -->
    <rect x="0" y="232" width="340" height="96" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="url(#boxBorder)" stroke-width="1.5" />
    <text x="24" y="276" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#c084fc">Decision Engine</text>
    <text x="24" y="304" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Trade-off &amp; architectural guidance</text>
  </g>

  <!-- Bottom Brand Bar -->
  <line x1="100" y1="520" x2="1100" y2="520" stroke="#334155" stroke-opacity="0.5" stroke-width="1" />
  <text x="100" y="565" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600" fill="#64748b">
    design-patterns.app • Client-Side Architecture Simulator
  </text>
</svg>

